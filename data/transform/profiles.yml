# dbt connection profile — every value is env-var driven so the same file
# works from host tooling (defaults, host port 5434) and from the compose
# `dbt` service (DBT_HOST=postgres, DBT_PORT=5432).
warehouse:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5434') | int }}"
      user: "{{ env_var('DBT_USER', 'smartops') }}"
      password: "{{ env_var('DBT_PASSWORD', 'smartops') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'smart_delivery_warehouse') }}"
      # Output schema selection (#54): the DEFAULT is the draft schema so
      # an un-configured build can never touch the production marts. Builds
      # from main opt into `analytics` explicitly (Makefile branch mapping,
      # the daily DAG, or DBT_SCHEMA=analytics by hand).
      schema: "{{ env_var('DBT_SCHEMA', 'analytics_draft') }}"
      threads: 4
