version: 2

sources:
  - name: raw
    description: >
      Append-only landings from the Kafka orders.events topic (see
      apps/worker/ingest.py). This is the ONLY place the transformation layer
      touches — never the operational database the API serves.
    schema: raw
    # Staleness alarm: ingested_at is the load timestamp written by the
    # consumer. If the newest row is older than these bounds, the pipeline
    # itself is broken (broker down, consumer stopped, relay stuck) — surface
    # that as a pipeline incident, not a silently stale dashboard.
    # `dbt source freshness` (part of `make dbt`) checks max(ingested_at).
    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    loaded_at_field: ingested_at
    tables:
      - name: order_events
        description: One row per order-lifecycle event, deduped by event_id.
        columns:
          - name: event_id
            description: Source primary key from order_events (the outbox log).
            tests: [unique, not_null]
          - name: order_id
            tests: [not_null]
          - name: event_type
            tests:
              - not_null
              - accepted_values:
                  values: [created, assigned, status]
          - name: schema_version
            tests:
              - accepted_values:
                  values: [1]
