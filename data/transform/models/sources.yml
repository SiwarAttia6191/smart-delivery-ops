version: 2

sources:
  - name: raw
    description: >
      Append-only landings from the Kafka orders.events topic (see
      apps/worker/ingest.py). This is the ONLY place the transformation layer
      touches — never the operational database the API serves.
    schema: raw
    # Staleness alarm: ingested_at is the load timestamp written by the
    # consumer. Bounds are set for a LOW-TRAFFIC demo: a quiet day must not
    # page anyone, so warn fires after 24h and error after 72h. The
    # production answer is a periodic heartbeat event per partition (the
    # kafka_partition/kafka_offset provenance columns on the raw layer are
    # already in place for per-partition freshness) - deferred until real
    # traffic exists to tune it against.
    # `dbt source freshness` (part of `make dbt`) checks max(ingested_at).
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 72, period: hour}
    loaded_at_field: ingested_at
    tables:
      - name: order_events
        description: One row per order-lifecycle event. Uniqueness is per
          (incarnation, event_id) — the DB's PK enforces it; replays after a
          restart legitimately re-land events under a new incarnation, and
          stg_order_events dedupes to the latest landing.
        columns:
          - name: event_id
            description: Source primary key from order_events (the outbox log).
            tests: [not_null]
          - name: order_id
            tests: [not_null]
          - name: event_type
            tests:
              - not_null
              - accepted_values:
                  values: [created, assigned, status, paid]  # paid = the checkout seam (#164)
              # NOTE: no unique-event_id test — the raw PK is (incarnation,
              # event_id) by design (#76 incarnation-safe replays): the same
              # event legitimately re-lands under a new deployment
              # incarnation after a restart. Dedupe to the latest incarnation
              # happens in stg_order_events.
          - name: schema_version
            tests:
              - accepted_values:
                  values: [1]
      - name: driver_events
        description: Driver availability transitions, deduped by event_id.
        columns:
          - name: event_id
            # unique is per (incarnation, event_id) — the DB's PK enforces it;
            # a plain unique on event_id fails by design after any replay
            tests: [not_null]
          - name: driver_id
            tests: [not_null]
          - name: event_type
            tests:
              - not_null
              - accepted_values:
                  values: [availability, location_update]  # #60 hysteresis moves
          - name: schema_version
            tests:
              - accepted_values:
                  values: [1]
