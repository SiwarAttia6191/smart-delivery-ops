version: 2

models:
  - name: stg_order_events
    description: Typed, flattened view over the raw event log. The only JSON
      unwrapping in the project happens here. event_id is unique per
      incarnation (the composite uniqueness is asserted by the singular
      tests, since two ops incarnations may legitimately reuse id ranges).
    columns:
      - name: event_id
        tests: [not_null]
      - name: order_id
        tests: [not_null]
      - name: event_type
        tests: [not_null]
  - name: stg_driver_events
    description: Typed, flattened view over raw driver availability events.
      event_id is unique per incarnation (see stg_order_events).
    columns:
      - name: event_id
        tests: [not_null]
      - name: driver_id
        tests: [not_null]
      - name: event_type
        tests: [not_null]
      - name: to_available
        tests:
          - not_null:
              # location_update rows (#60) carry `available` instead; the
              # boolean contract is per event type.
              config:
                where: "event_type = 'availability'"
      - name: available
        tests:
          - not_null:
              config:
                where: "event_type = 'location_update'"
