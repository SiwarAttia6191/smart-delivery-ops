# Alembic configuration (Phase 5, #28): the ops database's schema is owned
# by the migration chain in migrations/ — create_all survives ONLY for the
# throwaway test schema (guarded by tests/unit/test_migrations_parity.py,
# which fails the build the moment the chain drifts from the models).
#
# The database URL is NOT stored here: migrations/env.py takes it from the
# app settings (DATABASE_URL env) so migrations and the API share one
# source of truth. CI's data-plane smoke runs this chain against real
# Postgres on every pull request.
[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
# only migrations/ logs; the API's own logging config stays out of it
logging_config = ini:alembic

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
