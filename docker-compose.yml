services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8010:8000"  # host 8010 (8000 conflicts with common local tooling) → container 8000
    environment:
      ENVIRONMENT: docker
      # Inside Docker's network the postgres service listens on its internal
      # port 5432 — the host-side 5434 mapping does not apply here.
      DATABASE_URL: postgresql+psycopg://smartops:smartops@postgres:5432/smart_delivery_ops
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartops
      POSTGRES_PASSWORD: smartops
      POSTGRES_DB: smart_delivery_ops
    ports:
      - "5434:5432"  # host 5434 (local PG18 service occupies 5432) → container 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -d matters: without it pg_isready probes a database named after the
      # user, and Postgres logs a harmless-but-noisy FATAL every 5 seconds.
      test: ["CMD-SHELL", "pg_isready -U smartops -d smart_delivery_ops"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    # Same image as the API — only the entrypoint differs. Relays the
    # order_events outbox onto the Kafka bus (see apps/worker/relay.py).
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: python -m apps.worker.relay
    environment:
      ENVIRONMENT: docker
      DATABASE_URL: postgresql+psycopg://smartops:smartops@postgres:5432/smart_delivery_ops
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ingest:
    # Same image as the API — warehouse leg of the pipeline: subscribes to
    # orders.events and lands events into the raw layer of the separate
    # warehouse database (see apps/worker/ingest.py). Offsets commit only
    # after the DB commit; replays dedupe on the event_id primary key.
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: python -m apps.worker.ingest
    environment:
      ENVIRONMENT: docker
      WAREHOUSE_DATABASE_URL: postgresql+psycopg://smartops:smartops@postgres:5432/smart_delivery_warehouse
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  dbt:
    # Transformation layer: staging + marts over the warehouse raw layer.
    # On-demand only (not part of `up -d`): docker compose run --rm dbt build
    # Official dbt image — local Python is 3.14, dbt needs <= 3.12.
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.latest
    profiles: ["tools"]
    volumes:
      - ./data/transform:/usr/app
    working_dir: /usr/app
    environment:
      DBT_PROFILES_DIR: /usr/app
      DBT_HOST: postgres
      DBT_PORT: "5432"
    command: ["build", "--profiles-dir", "/usr/app"]

  kafka-init:
    # One-shot topic provisioning. Production disables auto-create (typos
    # would silently produce to dead topics, partition counts drift
    # uncontrolled) and declares topics explicitly — we do the same even in
    # dev. Partition count on a keyed topic is effectively permanent: raising
    # it later re-shuffles the key→partition mapping and breaks per-order
    # ordering between old and new data, so orders.events starts at 3.
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic orders.events --partitions 3 --replication-factor 1"

  kafka:
    # Official Apache Kafka image, KRaft mode (no ZooKeeper) — a single node
    # acting as both broker and controller, which is all a dev/demo stack needs.
    # Two listeners: containers reach it as kafka:19092, host tools (kcat,
    # console scripts, a locally-run worker) as localhost:9094.
    image: apache/kafka:3.9.0
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Topic data must survive container recreation: the relay's offset
      # (relay_state in Postgres) persists, so an ephemeral broker would
      # leave the bus silently empty while the database says "published".
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Dev-stack friendly heap — the default (~1G) is overkill next to
      # Postgres + API + worker on one machine.
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
  kafkadata:
