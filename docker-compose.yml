services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    ports:
      # Host ports are env-tunable so a second side-by-side deployment (e.g.
      # deploy/cities/paris.env, #78 region pack) can shift them.
      - "${API_HOST_PORT:-8010}:8000"  # 8000 conflicts with common local tooling → 8010
    environment:
      ENVIRONMENT: docker
      # Inside Docker's network the postgres service listens on its internal
      # port 5432 — the host-side 5434 mapping does not apply here.
      DATABASE_URL: postgresql+psycopg://smartops:smartops@postgres:5432/smart_delivery_ops
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Africa/Tunis}
      # Which city manifest drives /config and the demo surfaces (#78).
      CITY: ${CITY:-tunis}
      # JWT signing secret for the auth wall (#28). The default is
      # DEV-ONLY (documented); real deployments set their own.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-only-change-me}
      # ETA serving swap (#69): load the registry-promoted eta_model; if the
      # mlflow container is down the API logs the failure and serves the
      # heuristic fallback (sdo_eta_model_serving 0).
      ETA_MODEL_SOURCE: registry
      MLFLOW_TRACKING_URI: http://mlflow:5100
      # Cap the mlflow client's retry/backoff so a down registry costs the
      # API a few seconds at boot, not minutes of blocked startup.
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: 1
      MLFLOW_HTTP_REQUEST_TIMEOUT: 5
      # Shadow mode (issue #24): the OSRM challenger is computed alongside
      # every haversine decision and LOGGED, never used. Best-effort by
      # design: osrm runs in the tools profile, so start it with `docker
      # compose --profile tools up -d osrm`; if unavailable, its failure is
      # logged while the champion remains unaffected.
      DISTANCE_SHADOW_PROVIDER: osrm
      OSRM_BASE_URL: http://osrm:5000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartops
      POSTGRES_PASSWORD: smartops
      POSTGRES_DB: smart_delivery_ops
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"  # host 5434 (local PG18 service occupies 5432) → container 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -d matters: without it pg_isready probes a database named after the
      # user, and Postgres logs a harmless-but-noisy FATAL every 5 seconds.
      test: ["CMD-SHELL", "pg_isready -U smartops -d smart_delivery_ops"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    # Same image as the API — only the entrypoint differs. Relays the
    # order_events outbox onto the Kafka bus (see apps/worker/relay.py).
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: python -m apps.worker.relay
    environment:
      ENVIRONMENT: docker
      DATABASE_URL: postgresql+psycopg://smartops:smartops@postgres:5432/smart_delivery_ops
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_DRIVERS_TOPIC: drivers.events
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ingest:
    # Same image as the API — warehouse leg of the pipeline: subscribes to
    # orders.events and lands events into the raw layer of the separate
    # warehouse database (see apps/worker/ingest.py). Offsets commit only
    # after the DB commit; replays dedupe on the event_id primary key.
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: python -m apps.worker.ingest
    environment:
      ENVIRONMENT: docker
      WAREHOUSE_DATABASE_URL: postgresql+psycopg://smartops:smartops@postgres:5432/smart_delivery_warehouse
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_DRIVERS_TOPIC: drivers.events
      KAFKA_ORDERS_TOPIC: orders.events
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  osrm-prepare:
    # One-shot map preparation: runs the MLD pipeline (extract -> partition
    # -> customize) over the region's OSM extract. The region is env-tunable
    # (#78): OSRM_EXTRACT_ID names the extract (files <id>-latest.* inside
    # OSRM_DATA_DIR — Geofabrik's own naming), OSRM_DATA_DIR the data dir.
    # Takes a few minutes and ~1-3GB RAM, ONCE per region - results persist
    # in the bind-mounted dir. NOT part of `up -d`; the download happens on
    # the HOST (the image has no curl/wget):
    #   python scripts/fetch_osrm_extract.py --region <city>
    #   OSRM_EXTRACT_ID=<id> OSRM_DATA_DIR=data/osrm/<id> docker compose run --rm osrm-prepare
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["tools"]
    volumes:
      - ${OSRM_DATA_DIR:-./data/osrm}:/data
    working_dir: /data
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        # ${OSRM_EXTRACT_ID:-tunisia} is interpolated by COMPOSE into the
        # literal value; $$EXTRACT stays a shell variable ($$ = literal $).
        EXTRACT=${OSRM_EXTRACT_ID:-tunisia}
        if [ -f /data/$$EXTRACT-latest.osrm ]; then
          echo "OSRM data already prepared - skipping"
          exit 0
        fi
        [ -f /data/$$EXTRACT-latest.osm.pbf ] || { echo "missing /data/$$EXTRACT-latest.osm.pbf - run scripts/fetch_osrm_extract.py first"; exit 1; }
        osrm-extract -p /opt/car.lua /data/$$EXTRACT-latest.osm.pbf
        osrm-partition /data/$$EXTRACT-latest.osrm
        osrm-customize /data/$$EXTRACT-latest.osrm

  osrm:
    # Road-network routing service (the benchmark challenger). Needs the
    # prepared data from osrm-prepare; serves on host port 5000 (env-tunable
    # for a side-by-side second region). No healthcheck - the image ships no
    # curl/wget; liveness is checked by actually calling /route (the
    # benchmark script fails loudly).
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["tools"]
    command: osrm-routed --algorithm mld /data/${OSRM_EXTRACT_ID:-tunisia}-latest.osrm
    ports:
      - "${OSRM_HOST_PORT:-5000}:5000"
    volumes:
      - ${OSRM_DATA_DIR:-./data/osrm}:/data

  dbt:
    # Transformation layer: staging + marts over the warehouse raw layer.
    # On-demand only (not part of `up -d`): docker compose run --rm dbt build
    # Official dbt image — local Python is 3.14, dbt needs <= 3.12.
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.latest
    profiles: ["tools"]
    volumes:
      - ./data/transform:/usr/app
    working_dir: /usr/app
    environment:
      DBT_PROFILES_DIR: /usr/app
      DBT_HOST: postgres
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Africa/Tunis}  # #78 local business grains
      DBT_PORT: "5432"
    command: ["build", "--profiles-dir", "/usr/app"]

  airflow-init:
    # One-shot: creates the airflow metadata database on the shared Postgres
    # instance (existing volumes predate it), migrates the schema, seeds an
    # admin user for the UI. Dev credentials only — real deployments use
    # secrets management (documented in the roadmap).
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.airflow
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        psql -h postgres -U smartops -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'airflow'" | grep -q 1 || \
          psql -h postgres -U smartops -d postgres -c "CREATE DATABASE airflow"
        airflow db migrate
        airflow users create --username admin --password admin --firstname Data --lastname Engineering --role Admin --email admin@localhost || true
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # Airflow 2.10 pins SQLAlchemy 1.4 — psycopg2 dialect, not psycopg 3.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://smartops:smartops@postgres:5432/airflow
      PGPASSWORD: smartops  # for the init service's psql bootstrap
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__WEBSERVER__SECRET_KEY: "dev-only-change-me"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 10
      # Consumed by the DAG's dbt tasks (profiles.yml reads these env vars);
      # inside the compose network Postgres is postgres:5432.
      DBT_HOST: postgres
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Africa/Tunis}  # #78 local business grains
      DBT_PORT: "5432"
      # Failure-alert surface for the warehouse DAG: set to a webhook URL to
      # enable POSTs on task failure. Empty = log-only (the DAG's fallback
      # logs loudly so the gap stays discoverable).
      AIRFLOW_ALERT_WEBHOOK: ""
      # ML loop (scheduled retraining): the DAG tasks read these to grain
      # themselves and reach the tracking server / the city manifest.
      MLFLOW_TRACKING_URI: http://mlflow:5100
      CITY: ${CITY:-tunis}
      OSRM_BASE_URL: http://osrm:5000
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags
      - ./data/transform:/opt/transform
      # Scheduled ML tasks run in-process (fat-worker pattern): ml code is
      # bind-mounted live (cwd /home/airflow/mlrun), reports land in the
      # committed evidence dir, and the read-only ./.git gives every run its
      # exact GIT_SHA. Artifacts flow through the tracking server - no
      # artifact volume needed here.
      - ./ml:/home/airflow/mlrun/ml
      - ./data/benchmarks:/home/airflow/mlrun/data/benchmarks
      - ./.git:/opt/git:ro
      # LocalExecutor writes task logs into the SCHEDULER's filesystem; the
      # webserver needs the same volume or every "View log" in the UI fails.
      - airflow-logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    # Airflow UI on host 8081 (8080 is a common conflict): trigger runs, watch
    # task logs, inspect the dbt task graph.
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.airflow
    command: webserver
    ports:
      - "${AIRFLOW_HOST_PORT:-8081}:8080"
    environment: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    # Runs the warehouse_daily_build DAG on schedule (03:00 daily) and
    # executes tasks locally via LocalExecutor.
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.airflow
    command: scheduler
    environment: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  mlflow:
    # MLflow tracking server (Phase 3, issue #41): experiment runs for the
    # forecasting/ETA benchmark harness, backed by a self-provisioned
    # `mlflow` database on the shared Postgres instance. Artifacts land in
    # the bind-mounted ml/artifacts/ (gitignored). Tools profile - on demand.
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.ml
    profiles: ["tools"]
    ports:
      - "${MLFLOW_HOST_PORT:-5100}:5100"
    environment:
      PGPASSWORD: smartops  # entrypoint's psql provisioning runs non-interactive
    volumes:
      - ./ml:/ml
      - ml-artifacts:/mlart
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        psql -h postgres -U smartops -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'mlflow'" | grep -q 1 ||           psql -h postgres -U smartops -d postgres -c "CREATE DATABASE mlflow"
        if psql -h postgres -U smartops -d mlflow -tc "SELECT 1 FROM information_schema.tables WHERE table_name = 'alembic_version'" | grep -q 1; then
          mlflow db upgrade postgresql+psycopg2://smartops:smartops@postgres:5432/mlflow
        fi
        mlflow server --backend-store-uri postgresql+psycopg2://smartops:smartops@postgres:5432/mlflow           --artifacts-destination /mlart --host 0.0.0.0 --port 5100
    depends_on:
      postgres:
        condition: service_healthy

  ml-bench:
    # One-shot benchmark/training run (Prophet vs LightGBM vs seasonal-naive,
    # logged to MLflow): docker compose run --rm ml-bench
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.ml
    profiles: ["tools"]
    command: python training/benchmark_demand.py  # ./ml is mounted at WORKDIR /ml
    environment:
      WAREHOUSE_DATABASE_URL: postgresql+psycopg://smartops:smartops@postgres:5432/smart_delivery_warehouse
      DATABASE_URL: postgresql+psycopg://smartops:smartops@postgres:5432/smart_delivery_ops
      MLFLOW_TRACKING_URI: http://mlflow:5100
      MLFLOW_ARTIFACT_ROOT: /mlart
      GIT_SHA: ${GIT_SHA:-unknown}
      GIT_PYTHON_REFRESH: quiet  # mlflow probes for git; silence the import warning
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Africa/Tunis}  # #78 local business grains
      CITY: ${CITY:-tunis}  # region stamp on benchmark reports (#78)
      OSRM_BASE_URL: http://osrm:5000  # ETA benchmark challenger (osrm is profile-gated)
    volumes:
      - ./ml:/ml
      - ./data/benchmarks:/ml/benchmarks
      - ml-artifacts:/mlart
    depends_on:
      postgres:
        condition: service_healthy

  kafka-init:
    # One-shot topic provisioning. Production disables auto-create (typos
    # would silently produce to dead topics, partition counts drift
    # uncontrolled) and declares topics explicitly — we do the same even in
    # dev. Partition count on a keyed topic is effectively permanent: raising
    # it later re-shuffles the key→partition mapping and breaks per-order
    # ordering between old and new data, so orders.events starts at 3.
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic orders.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic drivers.events --partitions 3 --replication-factor 1

  kafka:
    # Official Apache Kafka image, KRaft mode (no ZooKeeper) — a single node
    # acting as both broker and controller, which is all a dev/demo stack needs.
    # Two listeners: containers reach it as kafka:19092, host tools (kcat,
    # console scripts, a locally-run worker) as localhost:9094 (env-tunable
    # so a side-by-side second deployment shifts both the mapping AND the
    # advertised listener together).
    image: apache/kafka:3.9.0
    ports:
      - "${KAFKA_HOST_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Explicit default (7 days): topic data is the operational buffer, NOT
      # the archive. The archive is the outbox itself - a lost warehouse
      # replays from order_events (see apps/worker/README.md).
      KAFKA_LOG_RETENTION_HOURS: "168"
      # Topic data must survive container recreation: the relay's offset
      # (relay_state in Postgres) persists, so an ephemeral broker would
      # leave the bus silently empty while the database says "published".
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Dev-stack friendly heap — the default (~1G) is overkill next to
      # Postgres + API + worker on one machine.
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
  kafkadata:
  airflow-logs:
  ml-artifacts:
