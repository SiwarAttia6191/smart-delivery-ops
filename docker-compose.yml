services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8010:8000"  # host 8010 (8000 conflicts with common local tooling) → container 8000
    environment:
      ENVIRONMENT: docker
      DATABASE_URL: postgresql+psycopg://smartops:smartops@postgres:5432/smart_delivery_ops
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartops
      POSTGRES_PASSWORD: smartops
      POSTGRES_DB: smart_delivery_ops
    ports:
      - "5433:5432"  # host 5433 (local PG18 service occupies 5432) → container 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
