# The demo unit (#169, decision 0004 phase A): exactly what the storefront
# touches, sized for a ~2 GB box. Deliberately a STANDALONE file, not a
# compose profile — `docker compose up -d` keeps meaning the full stack,
# and nothing here can config-drift it. Run it (a fresh VPS or locally —
# shift ports if the full stack occupies them):
#
#   docker compose -f docker-compose.demo.yml up -d --build
#   DATABASE_URL=postgresql+psycopg://sdo_app:<pw>@localhost:${DEMO_PG_PORT:-5434}/smart_delivery_ops \
#     python scripts/seed_demo.py          # after migrate completes
#
# What is deliberately ABSENT (and why): Airflow/MLflow/dbt/Grafana/
# Prometheus/k6/dashboard are the production story, not the demo; Kafka is
# absent, so the outbox accumulates instead of draining (harmless — the
# warehouse is not part of the demo surface) and relay/worker stay out with
# it. Demand forecasts are seeded as rows (scripts/seed_demo.py), so the
# live surge derivation works without the ML pipeline. OSRM needs the
# prepared extract (data/osrm, see the main stack's osrm-prepare flow).
#
# Posture: published sandbox credentials BY DESIGN — no OpenAI key on the
# box (the copilot serves its documented degraded chain), no real client
# data, nightly reset on the deploy side (0004 phase D).

name: smart-delivery-demo

x-build: &build
  build:
    context: .
    dockerfile: infra/docker/Dockerfile.api

services:
  postgres:
    mem_limit: 768m
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: smartops
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: smart_delivery_ops
    secrets: [db_password]
    command: ["postgres", "-c", "max_connections=120"]
    ports:
      - "${DEMO_PG_PORT:-5434}:5432"
    volumes:
      - demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d smart_delivery_ops"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    <<: *build
    mem_limit: 512m
    command: python scripts/bootstrap_roles.py
    environment:
      ENVIRONMENT: docker
      DATABASE_URL: postgresql+psycopg://smartops:smartops@postgres:5432/smart_delivery_ops
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_APP_PASSWORD_FILE: /run/secrets/app_db_password
    secrets: [db_password, app_db_password]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  osrm:
    mem_limit: 768m
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm mld /data/${OSRM_EXTRACT_ID:-tunisia}-latest.osrm
    volumes:
      - ${OSRM_DATA_DIR:-./data/osrm}:/data

  api:
    <<: *build
    mem_limit: 1g
    # Two workers: the demo box is small, and the storefront is a click
    # path, not a 300-VU load test (UVICORN_WORKERS stays env-tunable).
    command: >
      uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
      --workers ${UVICORN_WORKERS:-2}
    ports:
      - "${DEMO_API_PORT:-8010}:8000"
    environment:
      ENVIRONMENT: docker
      # Runtime role sdo_app: least-privilege, RLS applies (#36) — the
      # migrate one-shot (as smartops) applies the chain that creates it.
      DATABASE_URL: postgresql+psycopg://sdo_app:sdo_app@postgres:5432/smart_delivery_ops
      DB_PASSWORD_FILE: /run/secrets/app_db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Africa/Tunis}
      CITY: ${CITY:-tunis}
      OSRM_BASE_URL: http://osrm:5000
      # No OpenAI key on the demo box (0004): the copilot serves its
      # documented degraded chain — that behavior is part of the demo.
      COPILOT_PROVIDER: ${COPILOT_PROVIDER:-scripted}
      SDO_TRACING: "0"  # no MLflow here to trace to
    secrets: [app_db_password, jwt_secret]
    depends_on:
      migrate:
        condition: service_completed_successfully
      osrm:
        condition: service_started
    restart: unless-stopped

volumes:
  demo_pgdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  app_db_password:
    file: ./secrets/app_db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
