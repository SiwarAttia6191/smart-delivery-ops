[project]
name = "smart-delivery-ops"
version = "0.1.0"
description = "AI-powered delivery operations platform for smart routing, demand forecasting, dynamic pricing, and analytics in a startup logistics environment."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Siwar Attia" }]
keywords = [
  "fastapi", "delivery", "logistics", "operations", "data-engineering",
  "demand-forecasting", "dynamic-pricing", "analytics", "portfolio",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "core", "domain", "data", "ml", "scripts"]
